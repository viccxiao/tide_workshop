# Databricks Asset Bundle: the workshop's jobs defined as code.
# One definition, deployed to each environment with different settings.
# See cicd/README.md for how this is used from GitHub Actions.
#
#   databricks bundle validate -t dev --var catalog=<your_catalog>
#   databricks bundle deploy   -t dev --var catalog=<your_catalog>
#   databricks bundle run      training -t dev --var catalog=<your_catalog>

bundle:
  name: kyx-mlops

include:
  - cicd/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment
  schema:
    description: Schema that holds the features, model and monitoring tables
    default: kyx_mlops

targets:
  # Your own sandbox. Resources get a "[dev yourname]" prefix and schedules are paused.
  dev:
    mode: development
    default: true
    variables:
      schema: kyx_mlops_dev

  # Shared test environment. Deployed automatically when code is merged to main.
  staging:
    variables:
      schema: kyx_mlops_staging
    # workspace:
    #   host: https://<staging-workspace>.cloud.databricks.com

  # Production. Deployed from a release, runs as a service principal.
  prod:
    mode: production
    variables:
      schema: kyx_mlops
    workspace:
      # host: https://<prod-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}   # the deploying service principal's folder
    # run_as:
    #   service_principal_name: <application-id>
